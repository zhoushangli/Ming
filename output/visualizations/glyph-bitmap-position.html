<div id="ming-glyph-position">
  <div class="text-small">Label 局部坐标 · 示意数值（像素）</div>
  <svg class="glyph-diagram" role="img" aria-label="字形原点 P 在基线上，位图左上角 R 在 P 的右上方。横向偏移加三，纵向偏移负二十二。"></svg>
  <div class="viz-row"><span>● P：字形原点 (40, 30)</span><span>■ R：位图左上角 (43, 8)</span></div>
  <div class="viz-row text-small"><span>baselineY = ascent = 30</span><span>位图大小：14 × 22</span><span>A 轮廓为示意</span></div>
</div>
<style>
  #ming-glyph-position { color: var(--foreground); }
  #ming-glyph-position .glyph-diagram { display: block; width: 100%; overflow: visible; }
  #ming-glyph-position .glyph-diagram text { fill: var(--foreground); font-size: 12px; }
  #ming-glyph-position .viz-row { margin-top: 8px; }
</style>
<script>
(() => {
  const root = document.getElementById('ming-glyph-position');
  const svg = root.querySelector('.glyph-diagram');
  const ns = 'http://www.w3.org/2000/svg';
  function draw() {
    const w = Math.max(280, root.getBoundingClientRect().width);
    const s = Math.min(5, (w - 105) / 57);
    const x0 = 32, y0 = 48;
    const px = x0 + 40 * s, py = y0 + 30 * s;
    const rx = px + 3 * s, ry = py - 22 * s;
    const bw = 14 * s, bh = 22 * s;
    const height = py + 85;
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${w} ${height}`);
    svg.style.height = `${height}px`;
    function el(tag, attrs, text) {
      const node = document.createElementNS(ns, tag);
      Object.entries(attrs || {}).forEach(([k,v]) => node.setAttribute(k,v));
      if (text !== undefined) node.textContent = text;
      svg.appendChild(node);
      return node;
    }
    function line(x1,y1,x2,y2,color,dash) {
      const attrs = {x1,y1,x2,y2,stroke:color,'stroke-width':1.5};
      if (dash) attrs['stroke-dasharray'] = '4 4';
      return el('line',attrs);
    }
    function label(x,y,text,anchor='start') { el('text',{x,y,'text-anchor':anchor},text); }
    function arrow(x1,y1,x2,y2,color) {
      line(x1,y1,x2,y2,color);
      const a = Math.atan2(y2-y1,x2-x1), l=6;
      const points = [[x2,y2],[x2-l*Math.cos(a-0.5),y2-l*Math.sin(a-0.5)],[x2-l*Math.cos(a+0.5),y2-l*Math.sin(a+0.5)]];
      el('polygon',{points:points.map(p=>p.join(',')).join(' '),fill:color});
    }
    const neutral='var(--foreground)', origin='var(--viz-series-1)', bitmap='var(--viz-series-2)';
    el('title',{},'从字形原点 P 到位图左上角 R');
    el('desc',{},'横轴向右，纵轴向下。P 位于横坐标四十、基线三十。R 相对 P 向右三像素、向上二十二像素，因此 R 的坐标为四十三、八。');
    arrow(x0,y0,w-12,y0,neutral);
    arrow(x0,y0,x0,py+15,neutral);
    label(x0,y0-15,'Label (0, 0)');
    label(w-13,y0-10,'X →','end');
    label(8,py+38,'Y ↓');
    line(x0,py,w-12,py,origin);
    label(x0+10,py-10,'基线 y = 30');
    line(px,y0,px,py+65,'var(--border)',true);
    line(rx,ry,rx,py+10,'var(--border)',true);
    el('rect',{x:rx,y:ry,width:bw,height:bh,fill:bitmap,'fill-opacity':0.1,stroke:bitmap,'stroke-width':1.5});
    const path=`M ${rx} ${py} L ${rx+5.3*s} ${ry} L ${rx+8.7*s} ${ry} L ${rx+bw} ${py} L ${rx+10.8*s} ${py} L ${rx+9.4*s} ${py-6*s} L ${rx+4.6*s} ${py-6*s} L ${rx+3.2*s} ${py} Z M ${rx+5.3*s} ${py-9*s} L ${rx+8.7*s} ${py-9*s} L ${rx+7*s} ${ry+5*s} Z`;
    el('path',{d:path,fill:bitmap,'fill-rule':'evenodd','fill-opacity':0.85});
    el('circle',{cx:px,cy:py,r:4,fill:origin});
    label(px-8,py+19,'P','end');
    el('rect',{x:rx-3,y:ry-3,width:6,height:6,fill:bitmap});
    label(rx+9,ry+15,'R');
    const ax=px-24;
    arrow(ax,py,ax,ry,bitmap);
    line(ax-5,ry,rx-7,ry,'var(--border)',true);
    label(ax-9,(py+ry)/2-8,'offsetY','end');
    label(ax-9,(py+ry)/2+10,'−22（向上）','end');
    line(px,ry-16,rx,ry-16,bitmap);
    line(px,ry-20,px,ry-12,bitmap);
    line(rx,ry-20,rx,ry-12,bitmap);
    label(px-8,ry-6,'offsetX = +3','end');
    arrow(x0,py+48,px,py+48,origin);
    label((x0+px)/2,py+70,'glyph.m_posX = 40','middle');
  }
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
